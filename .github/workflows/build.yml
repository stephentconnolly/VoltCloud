# ═══════════════════════════════════════════════════════════════════════════
#  Volt Cloud — Automated Multi-Platform Build
#
#  WHAT THIS DOES:
#  Every time you publish a new version tag (e.g. v1.0.1), GitHub's cloud
#  computers automatically build installers for Windows, macOS, and Linux,
#  then attach them to a downloadable Release.
#
#  YOU NEVER TOUCH A TERMINAL. It all happens on GitHub's servers.
#
#  HOW TO TRIGGER A BUILD:  (covered step-by-step in GITHUB_ACTIONS_GUIDE.md)
#    - Either push a tag like v1.0.1
#    - Or click "Run workflow" on the Actions tab
# ═══════════════════════════════════════════════════════════════════════════

name: Build Volt Cloud

# When to run this workflow
on:
  # Trigger when you push a version tag like v1.0.0, v1.0.1, etc.
  push:
    tags:
      - 'v*'
  # Also allow manual triggering from the Actions tab (the "Run workflow" button)
  workflow_dispatch:

# Permission to create Releases and upload files to them
permissions:
  contents: write

jobs:
  build:
    # The build runs on three operating systems in parallel
    strategy:
      # If one platform fails, still finish the others
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Get your project files onto the build machine
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Linux-only build dependencies (rpm, fakeroot for .deb/.rpm)
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg libarchive-tools

      # 4. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 5a. Build Linux installers (AppImage + deb + rpm + tar.gz)
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage deb rpm tar.gz --publish never

      # 5b. Build Windows installers (NSIS installer + portable exe)
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis portable --publish never

      # 5c. Build macOS installers (dmg + zip, unsigned)
      #    CSC_IDENTITY_AUTO_DISCOVERY=false tells electron-builder to skip
      #    code signing (you don't have an Apple Developer cert yet).
      - name: Build macOS
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip --publish never

      # 6. Upload the built installers as "artifacts" so you can download them
      #    even from manually-triggered runs (not just tagged releases)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voltcloud-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 30

      # 7. If this was triggered by a version tag, attach the installers to a
      #    public GitHub Release so your users can download them.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
